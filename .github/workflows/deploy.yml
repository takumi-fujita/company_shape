name: Deploy

# フロントの変更を Cloudflare Pages に配信する。
#
# データ更新（data/companies.db）による配信はコンテナ側が wrangler で直接行うので、
# ここでは検知しない。両方が反応すると同じ内容を二重にデプロイすることになる。
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  # 日次 push が重なっても最新の 1 本だけを流す
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
        working-directory: apps/web

      # 配信前の最終防衛線。落ちたらデプロイしない。
      - name: 禁止語チェック
        run: npm run lint:words
        working-directory: apps/web

      - name: ユニットテスト
        run: npm test
        working-directory: apps/web

      # SSG スモークテスト: 全ページのビルドが 1 社も落ちずに完走すること
      - name: ビルド
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      - name: パフォーマンス予算
        run: npm run check:budget
        working-directory: apps/web

      - name: Cloudflare Pages へデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=kaisha-no-katachi --branch=main
          workingDirectory: apps/web
